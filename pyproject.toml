[project]
name = "jobpilot"
version = "1.0.0"
description = "JobPilot v1.0 - structured job analysis Agent"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faiss-cpu>=1.8,<2",
    "fastapi>=0.115,<1",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pypdf>=5,<7",
    "python-multipart>=0.0.20,<1",
    "sentence-transformers>=3,<6",
    "requests>=2.32,<3",
    "streamlit>=1.40,<2",
    "uvicorn>=0.34,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["*.md"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
